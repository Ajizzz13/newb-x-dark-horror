name: build

on:
  push:
    branches: ['*']
  workflow_dispatch:
    inputs:
      subversion:
        description: 'Sub-version (eg: 56)'
        default: '57'
        type: string

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        cache: 'pip'

    - uses: actions/cache@v6
      with:
        key: env-files-linux-laz
        path: |
          ${{ github.workspace }}/tool/data

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Build Android shader pack
      run: |
        ./build.sh setup
        ./build.sh pack -p android -v ${{ inputs.subversion || '57' }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: newb-x-dark-horror-android
        path: |
          ./build/*.mcpack
          ./build/pack-android

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v0.16.57-horror
        name: "Newb X - Dark Horror v0.16.57 (Android)"
        body: |
          ### 🌑 Newb X Legacy - Dark Horror Edition
          A dark, atmospheric horror shader for Minecraft Bedrock Edition (Android).

          #### ✨ Features:
          - **Siang Terang + Fog & Bayangan Ekstrem**: Sinar matahari terik pucat dengan kabut tebal merayap (*Silent Hill mist*) dan bayangan sangat pekat (0.98 intensity).
          - **Malam Sangat Gelap Gulita**: Cahaya bulan redup minimal, ambient boost ditekan ke 0.10.
          - **Obor Penyelamat**: Api obor berkedip-kedip (*flickering torch*) dengan kontras tinggi di kegelapan.
          - **Ore Bersinar Terang**: Pendaran bijih 5.5x lipat dilengkapi denyut halus (*pulsing shimmer*) dan pendaran aura ke blok sekeliling (*bloom leak*).
          - **Partikel Malam**: Partikel rintik hujan dan salju memancarkan pendar cahaya redup di kegelapan.
          - **Kompatibilitas**: Mendukung Minecraft Bedrock 1.21.0 s/d 1.26+ tanpa batasan `min_engine_version`.

          #### 📥 Cara Pasang:
          1. Unduh file **`.mcpack`** di bagian Assets di bawah ini.
          2. Buka file tersebut dengan Minecraft (atau import via MB Loader / file manager).
          3. Aktifkan di **Settings > Global Resources**.
        files: ./build/*.mcpack
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
