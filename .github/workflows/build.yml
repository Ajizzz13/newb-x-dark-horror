name: build

on:
  push:
    branches: ['*']
  workflow_dispatch:
    inputs:
      subversion:
        description: 'Sub-version (eg: 56)'
        required: false
        default: '56'
        type: string
      platform:
        description: 'Target platform to build for'
        required: true
        default: 'All'
        type: choice
        options:
        - Android
        - Windows
        - iOS
        - Multi-platform
        - All

jobs:
  windows:
    runs-on: windows-2022
    if: ${{ github.event_name == 'push' || github.event.inputs.platform == 'Windows' || github.event.inputs.platform == 'All' }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14' 
        cache: 'pip'
    - uses: actions/cache@v6
      with:
        key: env-files-win-laz
        path: |
          ${{ github.workspace }}/tool/data
    - run: pip install -r requirements.txt
    - run: |
        .\build.bat setup
        .\build.bat pack -p windows -v ${{ inputs.subversion || '56' }}
    - uses: actions/upload-artifact@v4
      with:
        name: newb-x-dark-horror-windows
        path: |
          ./build/*.mcpack
          ./build/pack-windows
  android:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.platform == 'Android' || github.event.inputs.platform == 'All' }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14' 
        cache: 'pip'
    - uses: actions/cache@v6
      with:
        key: env-files-linux-laz
        path: |
          ${{ github.workspace }}/tool/data
    - run: pip install -r requirements.txt
    - run: |
        ./build.sh setup
        ./build.sh pack -p android -v ${{ inputs.subversion || '56' }}
    - uses: actions/upload-artifact@v4
      with:
        name: newb-x-dark-horror-android
        path: |
          ./build/*.mcpack
          ./build/pack-android
  ios:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.platform == 'iOS' || github.event.inputs.platform == 'All' }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14' 
        cache: 'pip'
    - uses: actions/cache@v6
      with:
        key: env-files-linux-laz
        path: |
          ${{ github.workspace }}/tool/data
    - run: pip install -r requirements.txt
    - run: |
        ./build.sh setup
        ./build.sh pack -p ios -v ${{ inputs.subversion || '56' }}
    - uses: actions/upload-artifact@v4
      with:
        name: newb-x-dark-horror-ios
        path: |
          ./build/*.mcpack
          ./build/pack-ios
  multiplatform:
    runs-on: windows-2022
    if: ${{ github.event_name == 'push' || github.event.inputs.platform == 'Multi-platform' || github.event.inputs.platform == 'All' }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14' 
        cache: 'pip'
    - uses: actions/cache@v6
      with:
        key: env-files-win-laz
        path: |
          ${{ github.workspace }}/tool/data
    - run: pip install -r requirements.txt
    - run: |
        .\build.bat setup
        .\build.bat pack -p multiplatform -v ${{ inputs.subversion || '56' }}
    - uses: actions/upload-artifact@v4
      with:
        name: newb-x-dark-horror-multiplatform
        path: |
          ./build/*.mcpack
          ./build/pack-multiplatform
